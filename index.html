<!DOCTYPE html> 
<html lang="en"> 
  <head> 
    <meta charset="UTF-8" /> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> 
    <title>Shopping</title> 
    <link 
      
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" 
    />

    <style>

        .product-img{
            transition: transform 0.4s ease;
        }
        .product-img:hover{
            transform: scale(1.09);
        }
    </style>
  </head>
  <body>

    <header class="container my-4">
        <h1> Online Store</h1>
    </header>

    <main class="container">
        <div class="row g-4">

            <!-- Product 1 -->
            <div class="col-md-4">
                <div class="card">
                    <img class="card-img-top img-fluid product-img" src="AIR+FORCE+1+'07+LX+VIBRAM.avif" alt="nike shoe">
                    <div class="card-body">
                        <h2 class="card-title">Nike Airforce 1</h2>
                        <p class="card-text">R2000</p>
                        <button class="btn btn-primary">Buy</button>
                    </div>
                </div>
            </div>

            <!-- Product 2 -->
            <div class="col-md-4">
                <div class="card">
                    <img class="card-img-top img-fluid product-img" src="NIKE+AIR+MAX+95+OG.avif" alt="grey nike shoe">
                    <div class="card-body">
                        <h2 class="card-title">Nike Airmax 95 grey</h2>
                        <p class="card-text">R4000</p>
                        <button class="btn btn-primary">Buy</button>
                    </div>
                </div>
            </div>

            <!-- Product 3 -->
            <div class="col-md-4">
                <div class="card">
                    <img class="card-img-top img-fluid product-img" src="images (1).jpeg" alt="white nike shoe">
                    <div class="card-body">
                        <h2 class="card-title">Nike Airmax white</h2>
                        <p class="card-text">R4000</p>
                        <button class="btn btn-primary">Buy</button>
                    </div>
                </div>
            </div>

            <!-- Product 4 -->
            <div class="col-md-4">
                <div class="card">
                    <img class="card-img-top img-fluid product-img" src="images (2).jpeg" alt="red nike shoe">
                    <div class="card-body">
                        <h2 class="card-title">Nike Airforce 1 minus</h2>
                        <p class="card-text">R1500</p>
                        <button class="btn btn-primary">Buy</button>
                    </div>
                </div>
            </div>

            <!-- Product 5 -->
            <div class="col-md-4">
                <div class="card">
                    <img class="card-img-top img-fluid product-img" src="images.jpeg" alt="black nike shoe">
                    <div class="card-body">
                        <h2 class="card-title">Nike Runner</h2>
                        <p class="card-text">R2000</p>
                        <button class="btn btn-primary">Buy</button>
                    </div>
                </div>
            </div>

            <!-- Product 6 -->
            <div class="col-md-4">
                <div class="card">
                    <img class="card-img-top img-fluid product-img" src="download (1).webp" alt="grey jordan shoe">
                    <div class="card-body">
                        <h2 class="card-title">Jordan white and grey</h2>
                        <p class="card-text">R4000</p>
                        <button class="btn btn-primary">Buy</button>
                    </div>
                </div>
            </div>

            <!-- Product 7 -->
            <div class="col-md-4">
                <div class="card">
                    <img class="card-img-top img-fluid product-img" src="download (2).webp" alt="panda nike shoe">
                    <div class="card-body">
                        <h2 class="card-title">Nike panda</h2>
                        <p class="card-text">R3000</p>
                        <button class="btn btn-primary">Buy</button>
                    </div>
                </div>
            </div>

            <!-- Product 8 -->
            <div class="col-md-4">
                <div class="card">
                    <img class="card-img-top img-fluid product-img" src="download (3).webp" alt="colourful nike shoe">
                    <div class="card-body">
                        <h2 class="card-title">Nike runner colour</h2>
                        <p class="card-text">R4000</p>
                        <button class="btn btn-primary">Buy</button>
                    </div>
                </div>
            </div>

            <!-- Product 9 -->
            <div class="col-md-4">
                <div class="card">
                    <img class="card-img-top img-fluid product-img" src="download (4).webp" alt="white and grey nike shoe">
                    <div class="card-body">
                        <h2 class="card-title">Nike Airmax</h2>
                        <p class="card-text">R3000</p>
                        <button class="btn btn-primary">Buy</button>
                    </div>
                </div>
            </div>

            <!-- Product 10 -->
            <div class="col-md-4">
                <div class="card">
                    <img class="card-img-top img-fluid product-img" src="download.webp" alt="Shox nike shoe">
                    <div class="card-body">
                        <h2 class="card-title">Nike Shox</h2>
                        <p class="card-text">R4000</p>
                        <button class="btn btn-primary">Buy</button>
                    </div>
                </div>
            </div>
        
        </div>
    </main>

    <footer class="container my-5">
        <hr>
        <h2>Contact Us</h2>
        <form class="row row-cols-lg-auto g-3 align-items-center">
            <div class="col-auto">
                <img src="logo.png" alt="nike logo" style="height:30px">
            </div>
            <div class="col-12 col-lg-auto">
                <label class="visually-hidden" for="nameInput">Name</label>
                <input type="text" class="form-control" id="nameInput" placeholder="Your name">
            </div>
             <div class="col-12 col-lg-auto">
                <label class="visually-hidden" for="nameInput">Email</label>
                <input type="email" class="form-control" id="emailInput" placeholder="Your email">
            </div>
            <div class="col-12 col-lg-auto">
                <label class="visually-hidden" for="nameInput">Message</label>
                <input type="text" class="form-control" id="messageInput" placeholder="Message">
            </div>
            <div class="col-12 col-lg-auto">
                <button type="submit" class="btn btn-primary">Send</button>
            </div>    
        </form>

    </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
</body>
</html>
